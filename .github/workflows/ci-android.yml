name: CI Android

on:
  push:
    branches: [main]
    paths:
      - 'gestorfacil-android/**'
  pull_request:
    branches: [main]
    paths:
      - 'gestorfacil-android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27c
          build-tools: 35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gestorfacil-android/**/*.gradle*', 'gestorfacil-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gestorfacil-android/gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: gestorfacil-android

      - name: Run lint
        run: ./gradlew lintDebug
        working-directory: gestorfacil-android

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: gestorfacil-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: gestorfacil-android/app/build/reports/lint-results.html
          retention-days: 30